[project]
name = "lungfish"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Katerina", email = "kat.papapos@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "biopython>=1.88",
]

[project.scripts]
lungfish = "lungfish.pipeline:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
]

[tool.mypy]
python_version = "3.13"
# Biopython ships py.typed but leaves many functions unannotated.
untyped_calls_exclude = ["Bio"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["Bio.*"]
ignore_missing_imports = true